# Radar Kraken: confere os gatilhos de preço a cada 5 minutos e avisa no Telegram.
# Para rodar na mão: aba Actions > Radar Kraken > Run workflow.
# O GitHub não garante o horário: execuções podem atrasar de 5 a 30 minutos.

name: Radar Kraken

on:
  schedule:
    # Minutos 3, 8, 13... (fora dos minutos "redondos", quando o GitHub fica sobrecarregado e pula execuções)
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Mandar a mensagem 'Radar Kraken ligado' no Telegram"
        type: boolean
        default: true

permissions:
  contents: write  # para guardar os arquivos de dados/ no repositório

concurrency:
  group: radar  # uma rodada por vez, para duas não gravarem dados ao mesmo tempo
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Rodada do radar
        id: radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TESTE: ${{ github.event_name == 'workflow_dispatch' && inputs.teste }}
        run: |
          if [ "$TESTE" = "true" ]; then
            python -m radar.rodar --teste
          else
            python -m radar.rodar
          fi

      - name: Guardar dados no repositório (só quando algo mudou)
        env:
          PUBLICAR_PRECOS: ${{ steps.radar.outputs.publicar_precos }}
        run: |
          # precos.json e painel.json mudam a cada rodada: só vão para o repositório a cada 30 minutos
          if [ "$PUBLICAR_PRECOS" != "true" ]; then
            git checkout -- dados/precos.json dados/painel.json 2>/dev/null || true
          fi
          git add dados/
          if git diff --cached --quiet; then
            echo "Nada mudou nos dados: sem commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Dados do radar: $(date -u +%Y-%m-%dT%H:%MZ)"
          for tentativa in 1 2 3; do
            if git pull --rebase --quiet && git push --quiet; then exit 0; fi
            sleep 5
          done
          echo "Não consegui enviar os dados depois de 3 tentativas."
          exit 1
