# Relatório semanal do Radar Kraken: domingo à noite, no Telegram.
# Para rodar na mão: aba Actions > Relatório semanal > Run workflow.

name: Relatório semanal

on:
  schedule:
    - cron: "17 0 * * 1"  # segunda 00:17 UTC = domingo 21:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write  # para guardar dados/acertos.json no repositório

concurrency:
  group: radar  # a mesma fila do radar, para os dois não gravarem dados ao mesmo tempo
  cancel-in-progress: false

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Calcular acertos e mandar o relatório
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m radar.relatorio

      - name: Guardar acertos no repositório (só quando algo mudou)
        run: |
          git add dados/acertos.json
          if git diff --cached --quiet; then
            echo "Nada mudou nos acertos: sem commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Acertos do radar: $(date -u +%Y-%m-%dT%H:%MZ)"
          for tentativa in 1 2 3; do
            if git pull --rebase --quiet && git push --quiet; then exit 0; fi
            sleep 5
          done
          echo "Não consegui enviar os acertos depois de 3 tentativas."
          exit 1
